const byId = Object.fromEntries(partners.map(p=>[p.id,p]));
const state={phase:'hero',profile:{},answers:{},qIndex:0,showExtra:false,feedback:0,serviceDelivered:''};
const app=document.getElementById('app');
const H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=n=>String(n).replace(/[0-9]/g,c=>'٠١٢٣٤٥٦٧٨٩'[Number(c)]);
const badge=(txt)=>`<span class="pill">${txt}</span>`;
const logo=p=>`<img loading="lazy" referrerpolicy="no-referrer" src="${H(p.logo)}" alt="شعار ${H(p.name)}" onerror="this.hidden=true">`;
const icons={student:'🎓',jobseeker:'💼',public:'🏛️',private:'🏢',owner:'🧑‍💼',other:'✨',existing:'🏪',distressed:'🧩',idea:'💡',none:'🌱',cr:'📄',freelance:'🪪',both:'📑',unregistered:'📝',micro:'🌱',small:'🏬',medium:'🏢',unknown:'❔',finance:'💰',regulations:'📋',training:'🎓',feasibility:'📊',growth:'🚀',costs:'🧾',consulting:'🤝',community:'🌿',otherNeed:'💬'};
function Q(id,title,sub,options){return{id,title,sub,options};}
const statusOptions=[['student','طالب / طالبة'],['jobseeker','باحث / باحثة عن عمل'],['public','موظف / موظفة في القطاع الحكومي'],['private','موظف / موظفة في القطاع الخاص'],['owner','صاحب / صاحبة مشروع'],['other','مهتم / مهتمة بريادة الأعمال']];
function questions(){const a=state.answers;const q=[Q('status','كيف تصف وضعك الحالي؟','اختيار واحد يساعدنا على اختيار الأسئلة التي تهمك فقط.',statusOptions)];if(!a.status)return q;
 if(a.status!=='owner'){q.push(Q('project','أين أنت في رحلتك الريادية؟','لا تحتاج إلى مشروع جاهز للاستفادة من الجهات المشاركة.',[['existing','لدي مشروع تجاري قائم'],['distressed','لدي مشروع يواجه تعثرًا'],['idea','لدي فكرة مشروع'],['none','لا يوجد لدي مشروع أو فكرة بعد']]));if(!a.project)return q;}
 else a.project='existing';
 if(['existing','distressed'].includes(a.project)){
  q.push(Q('legal','ما وضع مشروعك النظامي؟','يساعدنا على اقتراح الجهة والخدمة المناسبة.',[['cr','لدي سجل تجاري'],['freelance','لدي وثيقة عمل حر'],['both','لدي كلاهما'],['unregistered','لم أستخرج وثيقة أو سجلًا بعد']]));if(!a.legal)return q;
  q.push(Q('size','كيف تصنف حجم منشأتك؟','لا بأس إذا لم تكن متأكدًا من التصنيف.',[['micro','متناهية الصغر'],['small','صغيرة'],['medium','متوسطة'],['unknown','لا أعرف تصنيفها']]));if(!a.size)return q;
 }
 q.push(Q('need','ما أبرز احتياج أو تحدٍ ترغب بحله؟','اختر الأكثر أهمية الآن، وستحصل على جهة رئيسية وجهة مساندة.',[
 ['finance','تمويل أو تسهيلات مالية'],['regulations','إجراءات حكومية أو سجل تجاري'],['training','تدريب أو تأهيل'],['feasibility','دراسة جدوى أو تقييم فكرة'],['growth','تسويق ونمو وعلاقات أعمال'],['costs','خفض التكاليف والخدمات التشغيلية'],['consulting','استشارة لمشكلة في المشروع'],['community','استكشاف الفرص والمبادرات'],['otherNeed','احتياج آخر']
 ]));if(!a.need)return q;
 q.push(Q('details','هل تود إضافة وصف مختصر لطلبك؟','هذه الخطوة اختيارية. يمكنك الانتقال مباشرة إلى التوجيه.',[]));return q;
}
function result(){const a=state.answers;let main='monshaat',secondary='mujtamae',why='',programs=[];
 switch(a.need){
 case'finance':main='bank';secondary=a.project==='idea'?'mujtamae':'chamber';why='لأن أولويتك تمويل المشروع، فالأفضل البدء بفهم المنتجات التمويلية وشروطها، ثم مراجعة جاهزية المشروع مع الجهة المساندة.';break;
 case'regulations':main='business';secondary='monshaat';why='لأن طلبك يتعلق بتأسيس نشاط تجاري أو إجراء نظامي، فالمركز السعودي للأعمال هو بوابتك الأساسية، ومنشآت تساعدك في خطوات الإطلاق.';break;
 case'training':main=['student','jobseeker'].includes(a.status)&&a.project==='none'?'mujtamae':'monshaat';secondary=main==='mujtamae'?'monshaat':'chamber';why='لأنك تبحث عن التأهيل، نوصيك باستكشاف البرامج المتاحة لدى الجهة الأولى مع مسارات التدريب والإرشاد لدى الشريك الآخر.';break;
 case'feasibility':main='monshaat';secondary='chamber';why='تقييم الفكرة ونموذج العمل قبل الانطلاق يساعدك على اتخاذ قرار أفضل؛ ابدأ بمراكز الدعم والاستشارات ثم استكمل المعلومات التجارية.';break;
 case'growth':main='chamber';secondary='monshaat';why='النمو والتسويق يحتاجان إلى معرفة سوقك وبناء العلاقات؛ ابدأ بالخدمات الاقتصادية والشبكات التجارية، ثم برامج تطوير المنشآت.';break;
 case'costs':main='monshaat';secondary='chamber';why='خدمة «مزايا» التابعة لمنشآت تقدم عروضًا وخدمات مخفضة وفق متطلباتها، وقد تفيدك غرفة القصيم في تحسين الجوانب التشغيلية.';break;
 case'consulting':main='chamber';secondary='monshaat';why='التحديات القائمة تحتاج إلى تشخيص عملي واستشارة متخصصة، ثم استكشاف البرامج المناسبة لتطوير المشروع.';break;
 case'community':main='mujtamae';secondary='monshaat';why='لأنك تستكشف فرص البداية، ابدأ بمؤسسة مجتمعي للتعرف على المبادرات ومسار «مشروعك»، ثم استكشف فرص التمكين الريادي.';break;
 case'otherNeed':main='mujtamae';secondary='monshaat';why='احتياجك يحتاج إلى توضيح مباشر؛ ابدأ بنقطة توجيه مجتمعي لشرح طلبك واختيار الشريك المناسب.';break;
 }
 const p=byId[main],s=byId[secondary];return {p,s,why,programs:p.programs};
}

function showProfile(){mount(`<section class="sheet view"><div class="step-meta">${badge('الخطوة الأولى')}<span>بياناتك الأساسية</span></div><div class="meter"><span style="width:13%"></span></div><span class="section-kicker">خلّنا نتعارف</span><h2 class="step-title">مرحبًا بك في برنامج «مشروعك» 👋</h2><p class="step-intro">فقط ٤ بيانات أساسية لنبدأ، ثم نختار لك أسئلة تلائم وضعك الريادي.</p><form id="profileForm" novalidate><div class="fields"><div class="field"><label for="firstName">الاسم الأول <b aria-hidden="true">*</b></label><input id="firstName" name="firstName" required minlength="2" maxlength="60" autocomplete="given-name" placeholder="أدخل اسمك الأول" value="${H(state.profile.firstName||'')}"><div class="error" id="errFirstName" role="alert"></div></div><div class="field"><label for="lastName">اسم العائلة <b aria-hidden="true">*</b></label><input id="lastName" name="lastName" required minlength="2" maxlength="60" autocomplete="family-name" placeholder="أدخل اسم العائلة" value="${H(state.profile.lastName||'')}"><div class="error" id="errLastName" role="alert"></div></div><div class="field"><label for="phone">رقم الجوال <b aria-hidden="true">*</b></label><input id="phone" name="phone" required inputmode="tel" autocomplete="tel" dir="ltr" placeholder="05XXXXXXXX" maxlength="16" value="${H(state.profile.phone||'')}"><div class="error" id="errPhone"></div></div><div class="field"><label for="email">البريد الإلكتروني <b aria-hidden="true">*</b></label><input id="email" name="email" type="email" required autocomplete="email" dir="ltr" placeholder="you@example.com" value="${H(state.profile.email||'')}"><div class="error" id="errEmail"></div></div></div><button type="button" id="extraToggle" class="extra-toggle" aria-expanded="${state.showExtra}">+ بيانات إضافية من الاستبيان (اختياري)</button><div id="extra" class="extra-fields" ${state.showExtra?'':'hidden'}><div class="fields"><div class="field"><label for="city">المدينة</label><input id="city" name="city" maxlength="65" value="${H(state.profile.city||'')}" placeholder="مثلاً: بريدة"></div><div class="field"><label for="nationality">الجنسية</label><input id="nationality" name="nationality" maxlength="55" value="${H(state.profile.nationality||'')}" placeholder="الجنسية"></div><div class="field"><label for="gender">الجنس</label><select id="gender" name="gender"><option value="">اختياري</option><option value="male" ${state.profile.gender==='male'?'selected':''}>ذكر</option><option value="female" ${state.profile.gender==='female'?'selected':''}>أنثى</option></select></div><div class="field"><label for="birthdate">تاريخ الميلاد</label><input id="birthdate" name="birthdate" type="date" max="${new Date().toISOString().slice(0,10)}" value="${H(state.profile.birthdate||'')}"></div></div></div><div class="privacy">🔒 <strong>خصوصيتك مهمة:</strong> عند إكمال الاستبيان ستُحفظ بيانات التسجيل والإجابات والتوجيه في قاعدة بيانات مشروع مجتمعي. الاستضافة حاليًا في سيول بكوريا الجنوبية (خارج المملكة العربية السعودية). يُرجى استخدام بيانات اختبارية لحين اعتماد ترتيبات الخصوصية ونقل البيانات.</div><label class="checkline"><input type="checkbox" id="consent" required><span>اطلعت على إشعار الخصوصية وأوافق على استخدام إجاباتي وحفظ بياناتي لغرض التوجيه، وأعلم بأن الاستضافة حاليًا خارج المملكة العربية السعودية.</span></label><div id="errConsent" class="error" role="alert"></div><div class="step-actions"><button type="button" class="back" data-action="home">→ العودة</button><button type="submit" class="btn btn-primary">التالي: حدد احتياجك ←</button></div></form></section>`);
 document.getElementById('extraToggle').onclick=()=>{state.showExtra=!state.showExtra;document.getElementById('extra').hidden=!state.showExtra;document.getElementById('extraToggle').setAttribute('aria-expanded',String(state.showExtra));};
 document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,firstName=f.querySelector('#firstName').value.trim().replace(/\s+/g,' '),lastName=f.querySelector('#lastName').value.trim().replace(/\s+/g,' '),phone=f.phone.value.trim().replace(/[\s()-]/g,''),email=f.email.value.trim();let ok=true;const er=(id,msg)=>{document.getElementById(id).textContent=msg;if(msg)ok=false};er('errFirstName',firstName.length<2?'الرجاء إدخال الاسم الأول (حرفان على الأقل).':'');er('errLastName',lastName.length<2?'الرجاء إدخال اسم العائلة (حرفان على الأقل).':'');er('errPhone',!/^(?:\+9665|9665|05|5)\d{8}$/.test(phone)?'أدخل رقم جوال سعودي صحيحًا مثل 05XXXXXXXX.':'');er('errEmail',!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)?'أدخل بريدًا إلكترونيًا صحيحًا.':'');er('errConsent',!f.querySelector('#consent').checked?'الموافقة مطلوبة للمتابعة.':'');if(!ok)return;
 state.profile={firstName,lastName,fullName:`${firstName} ${lastName}`,phone,email,city:f.city?.value.trim()||'',nationality:f.nationality?.value.trim()||'',gender:f.gender?.value||'',birthdate:f.birthdate?.value||''};state.phase='question';state.qIndex=0;render()};}
function showQuestion(){const qs=questions();state.qIndex=Math.min(state.qIndex,qs.length-1);const q=qs[state.qIndex];if(!q){state.phase='result';return render();}const stepsDone=Object.keys(state.answers).filter(k=>k!=='project' || state.answers.status!=='owner').length;const pct=Math.min(90,25+stepsDone*16);
 const last=q.id==='details';const opts=q.options.map(([value,label])=>`<button class="option ${state.answers[q.id]===value?'active':''}" type="button" data-answer="${H(value)}"><span class="symbol" aria-hidden="true">${icons[value]||'✦'}</span><span><strong>${H(label)}</strong></span></button>`).join('');
 mount(`<section class="sheet view"><div class="step-meta">${badge(last?'خطوة اختيارية':'لنفهم احتياجك')}<span>${digits(state.qIndex+1)} / مسار مخصص لك</span></div><div class="meter"><span style="width:${pct}%"></span></div><span class="section-kicker">${last?'تقريبًا وصلنا!':'سؤال سريع'}</span><h2 class="step-title">${q.title}</h2><p class="step-intro">${q.sub}</p>${last?`<div class="field"><label for="details">فكرة المشروع أو وصف الطلب</label><textarea id="details" placeholder="ما فكرة مشروعك أو التحدي الذي تواجهه؟" maxlength="700">${H(state.answers.details||'')}</textarea><span class="field-hint">يمكنك ترك هذا الحقل فارغًا.</span></div><div class="field mini-input"><label for="otherService">خدمة إضافية لم تجدها في الخيارات؟ (اختياري)</label><input id="otherService" maxlength="250" value="${H(state.answers.otherService||'')}" placeholder="اكتب نوع الخدمة أو المساعدة المطلوبة"></div>`:`<div class="answers">${opts}</div>`}<div class="step-actions"><button class="back" type="button" data-action="back">→ السؤال السابق</button>${last?'<button class="btn btn-primary" data-action="result">اعرض وجهتي المناسبة ✦</button>':'<span class="badge-optional">اختيار واحد فقط</span>'}</div></section>`);
 app.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.answer;state.answers[q.id]=v;if(q.id==='status'){state.answers={status:v};}else if(q.id==='project'){const keep={status:state.answers.status,project:v};state.answers=keep;}
 state.qIndex++;setTimeout(render,100);}));}
function showResult(){const r=result();const name=state.profile.firstName||state.profile.fullName?.split(' ')[0]||'زائرنا';const choiceText=questions().filter(q=>state.answers[q.id]&&q.id!=='details').map(q=>{const o=q.options.find(x=>x[0]===state.answers[q.id]);return o?.[1]}).filter(Boolean);
 mount(`<section class="sheet view result"><div class="result-head"><div class="success-icon">✓</div><div><span class="section-kicker">وجهتك جاهزة</span><h2>وجدنا لك الجهة الأنسب، ${H(name)}!</h2></div></div><p>حسب إجاباتك، نرشّح لك الجهة الأنسب لاحتياجك، مع جهة أخرى يمكنها مساعدتك.</p><div class="chips">${choiceText.map(x=>`<span class="chip">${H(x)}</span>`).join('')}</div><div class="destination"><div><span class="kicker">وجهتك الأولى — الجهة المقترحة</span><h3>${H(r.p.name)}</h3><p class="reason">${H(r.why)}</p></div><div class="result-logo">${logo(r.p)}</div></div><div class="secondary-booth"><div><small>ننصحك أيضًا بزيارة</small><strong>${H(r.s.name)}</strong><p style="font-size:12px;margin:3px 0 0">${H(r.s.purpose)}</p></div><div class="support-logo">${logo(r.s)}</div></div><div class="programs"><h4>ما الذي يمكنك السؤال عنه في ${H(r.p.name)}؟</h4><ul>${r.programs.map(x=>`<li>${H(x)}</li>`).join('')}</ul><a href="${H(r.p.url)}" target="_blank" rel="noopener noreferrer">عرض خدمات الجهة الرسمية ↗</a></div>${state.answers.details||state.answers.otherService?`<div class="privacy">وصف طلبك: ${H(state.answers.details||state.answers.otherService)}</div>`:''}<div class="form-row"><button class="btn btn-primary" data-action="share">مشاركة التوجيه ↗</button><button class="btn btn-soft" data-action="copy">نسخ النتيجة ⧉</button><button class="btn btn-link" data-action="reset">إعادة التجربة</button></div><div class="error" id="copyMsg" role="status"></div><p class="terms">التوصيات استرشادية، ولا تعني ضمان التمويل أو الحصول على خدمة؛ قبول الطلب يخضع للشروط والسياسات الرسمية لكل جهة.</p><div class="survey-question"><b class="section-kicker">استبيان مجتمعي — بعد زيارة الجهة (اختياري)</b><p style="font-size:13px;margin:10px 0 6px">هل تم تقديم الحل المناسب لطلبك؟</p><div class="form-row" style="margin-top:3px"><button type="button" class="btn btn-soft" data-service="yes">نعم</button><button type="button" class="btn btn-soft" data-service="partial">جزئيًا</button><button type="button" class="btn btn-soft" data-service="no">لا</button></div><p style="font-size:11px" id="serviceMsg">${state.serviceDelivered?"تم تسجيل الاختيار في هذه الجلسة فقط.":"اختر بعد زيارة الجهة — لا يُحفظ التقييم بعد."}</p><p style="font-size:13px;margin:9px 0">ما مدى رضاك عن جودة التوجيه؟</p><div class="stars" role="group" aria-label="رضاك عن التوجيه من خمس نجوم">${[1,2,3,4,5].map(n=>`<button aria-label="${n} من 5" title="${n} من 5" data-rate="${n}" class="${n<=state.feedback?'selected':''}">★</button>`).join('')}</div><p style="font-size:11px" id="rateMsg">${state.feedback?'شكرًا لتقييمك التجريبي. لم يُحفَظ التقييم.':'التقييم في هذه النسخة لا يُحفظ.'}</p></div></section>`);}
async function copyOrShare(share){const r=result(),message=`وجهتي في ملتقى ريادة الأعمال بالقصيم 2026:\nالجهة المقترحة: ${r.p.name}\nجهة مساندة: ${r.s.name}\n${r.why}`;try{if(share&&navigator.share)await navigator.share({title:'وجهتي في الملتقى',text:message});else if(navigator.clipboard)await navigator.clipboard.writeText(message);else{const t=document.createElement('textarea');t.value=message;document.body.append(t);t.select();document.execCommand('copy');t.remove();}if(document.getElementById('copyMsg'))document.getElementById('copyMsg').textContent='تمت مشاركة / نسخ التوجيه بنجاح.'}catch(e){if(e.name!=='AbortError'&&document.getElementById('copyMsg'))document.getElementById('copyMsg').textContent='تعذر النسخ تلقائيًا؛ يمكنك تصوير النتيجة.'}}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action],button[data-rate],button[data-service]');if(!b)return;if(b.dataset.service){state.serviceDelivered=b.dataset.service;return showResult();}const action=b.dataset.action;if(b.dataset.rate){state.feedback=Number(b.dataset.rate);return showResult();}
 switch(action){case'start':state.phase='profile';return render();case'home':case'reset':state.phase='hero';state.profile={};state.answers={};state.qIndex=0;state.feedback=0;state.showExtra=false;return render();case'back':if(state.qIndex===0){state.phase='profile'}else{state.qIndex--;const prior=questions()[state.qIndex];if(prior?.id!=='status')delete state.answers[prior?.id];}return render();case'result':state.answers.details=document.getElementById('details')?.value.trim()||'';state.answers.otherService=document.getElementById('otherService')?.value.trim()||'';state.phase='result';return render();case'copy':return copyOrShare(false);case'share':return copyOrShare(true);case'partners':return showPartners();}});
document.getElementById('restartTop').addEventListener('click',()=>{state.phase='hero';state.profile={};state.answers={};state.qIndex=0;state.feedback=0;render()});document.getElementById('brandHome').addEventListener('click',e=>{e.preventDefault();state.phase='hero';state.profile={};state.answers={};state.qIndex=0;render()});
function showPartners(){mount(`<section class="sheet view"><div class="step-meta">${badge('الجهات المشاركة')}<span>نسخة أولية للملتقى</span></div><h2 class="step-title">معك في كل خطوة ريادية.</h2><p class="step-intro">هذه الجهات الخمس المذكورة في إعلان الملتقى. لكل جهة مسار خدمات مختلف.</p><div class="logos">${heroPartners()}</div><div class="programs"><ul>${partners.map(p=>`<li><b>${H(p.name)}:</b> ${H(p.purpose)}. <a href="${p.url}" target="_blank" rel="noopener">الموقع الرسمي ↗</a></li>`).join('')}</ul></div><div class="form-row"><button class="btn btn-primary" data-action="start">ابدأ التوجيه ←</button><button class="btn btn-soft" data-action="home">العودة للرئيسية</button></div></section>`)}
render();
